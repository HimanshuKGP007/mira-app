[project]
name = "mira-app"
version = "0.1.0"
description = "Phoneme-level speech scoring and clinical analytics"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
# The acoustic model. Only needed to score real audio; the demo and the whole
# test suite run without it.
audio = ["torch>=2.0", "transformers>=4.45", "librosa>=0.10", "soundfile>=0.12"]
# The browser interface.
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
# The correlate path. Optional because it is the only measurement whose
# reference ranges are unvalidated.
correlates = ["praat-parselmouth>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
mira = "mira_app.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mira_app*"]
